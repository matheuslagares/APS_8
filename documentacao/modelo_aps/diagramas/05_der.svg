><line x1="271" y1="323" x2="509.669" y2="323" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="343.4" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="347.888" fill="#000" font-size="12" textLength="205.669">id : INTEGER «PK, AUTOINCREMENT»</text><line x1="271" y1="360.8" x2="509.669" y2="360.8" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="381.2" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="385.688" fill="#000" font-size="12" textLength="70.5">bairro : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="411" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="415.488" fill="#000" font-size="12" textLength="89.197">endereco : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="440.8" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="445.288" fill="#000" font-size="12" textLength="89.581">descricao : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="470.601" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="475.089" fill="#000" font-size="12" textLength="92.641">gravidade : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="500.401" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="504.889" fill="#000" font-size="12" textLength="128.833">situacao : TEXT = 'ativo'</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="281" cy="530.201" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="294" y="534.689" fill="#000" font-size="12" textLength="94.621">criado_em : TEXT</text><text x="294" y="564.489" fill="#000" font-size="12" textLength="170.389">autor_id : INTEGER «FK, NULL»</text><text x="294" y="594.289" fill="#000" font-size="12" textLength="125.929">latitude : REAL «NULL»</text><text x="294" y="624.089" fill="#000" font-size="12" textLength="136.921">longitude : REAL «NULL»</text></g><!--class anexos--><g class="entity" data-qualified-name="anexos" id="ent0004" data-source-line="48"><rect x="122" y="661.2" width="240.669" height="234.601" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="222.199" y="687.088" fill="#000" font-size="12" textLength="40.272">anexos</text><line x1="123" y1="701" x2="361.669" y2="701" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="721.4" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="725.888" fill="#000" font-size="12" textLength="205.669">id : INTEGER «PK, AUTOINCREMENT»</text><line x1="123" y1="738.8" x2="361.669" y2="738.8" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="759.2" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="763.688" fill="#000" font-size="12" textLength="163.045">ocorrencia_id : INTEGER «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="789" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="793.488" fill="#000" font-size="12" textLength="178.969">nome_arquivo : TEXT «UNIQUE»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="818.8" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="823.288" fill="#000" font-size="12" textLength="58.188">tipo : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="848.601" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="853.089" fill="#000" font-size="12" textLength="98.353">mime_type : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="133" cy="878.401" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="146" y="882.889" fill="#000" font-size="12" textLength="109.585">tamanho : INTEGER</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="63"><path d="M385.5,689.7 L385.5,868.101 A0,0 0 0 0 385.5,868.101 L693.75,868.101 A0,0 0 0 0 693.75,868.101 L693.75,699.7 L683.75,689.7 L452.25,689.7 L448.25,637.61 L444.25,689.7 L385.5,689.7 A0,0 0 0 0 385.5,689.7" style="stroke:#A38B50;stroke-width:0.5;" fill="#FFF8E7"/><path d="M683.75,689.7 L683.75,699.7 L693.75,699.7 L683.75,689.7" style="stroke:#A38B50;stroke-width:0.5;" fill="#FFF8E7"/><text x="396.5" y="715.588" fill="#000" font-size="12" textLength="196.813">CHECKs no schema de banco novo:</text><text x="396.5" y="735.388" fill="#000" font-size="12" textLength="154.165">length(bairro) entre 1 e 100</text><text x="396.5" y="755.188" fill="#000" font-size="12" textLength="172.861">length(endereco) entre 1 e 200</text><text x="396.5" y="774.988" fill="#000" font-size="12" textLength="180.109">length(descricao) entre 1 e 1000</text><text x="396.5" y="794.788" fill="#000" font-size="12" textLength="197.629">gravidade IN ('baixa', 'media', 'alta')</text><text x="396.5" y="814.589" fill="#000" font-size="12" textLength="169.441">situacao IN ('ativo', 'resolvido')</text><text x="396.5" y="834.389" fill="#000" font-size="12" textLength="277.25">latitude entre -90 e 90; longitude entre -180 e 180</text><text x="396.5" y="854.189" fill="#000" font-size="12" textLength="266.822">coordenadas ambas NULL ou ambas não NULL.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="74"><path d="M81.5,920.2 L81.5,1019.4 A0,0 0 0 0 81.5,1019.4 L403.094,1019.4 A0,0 0 0 0 403.094,1019.4 L403.094,930.2 L393.094,920.2 L246.5,920.2 L242.5,896.4 L238.5,920.2 L81.5,920.2 A0,0 0 0 0 81.5,920.2" style="stroke:#A38B50;stroke-width:0.5;" fill="#FFF8E7"/><path d="M393.094,920.2 L393.094,930.2 L403.094,930.2 L393.094,920.2" style="stroke:#A38B50;stroke-width:0.5;" fill="#FFF8E7"/><text x="92.5" y="946.088" fill="#000" font-size="12" textLength="263.414">CHECK tipo IN ('imagem', 'video'); tamanho > 0.</text><text x="92.5" y="965.888" fill="#000" font-size="12" textLength="290.594">Índice não único: anexos_ocorrencia(ocorrencia_id).</text><text x="92.5" y="985.688" fill="#000" font-size="12" textLength="253.37">O SQLite permite 0..N anexos por ocorrência.</text><text x="92.5" y="1005.488" fill="#000" font-size="12" textLength="218.75">A API limita a um arquivo por cadastro.</text></g><!--link usuarios to sessoes--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="58" data-link-type="crowfoot"><path d="M193,267.43 C193,303.24 193,318.57 193,354.39" style="stroke:#181818;stroke-width:1;" fill="none" id="usuarios-sessoes" codeLine="58"/><line x1="189" y1="263.43" x2="197" y2="263.43" style="stroke:#181818;stroke-width:1;"/><line x1="189" y1="266.43" x2="197" y2="266.43" style="stroke:#181818;stroke-width:1;"/><line x1="193" y1="267.43" x2="193" y2="259.43" style="stroke:#181818;stroke-width:1;"/><line x1="193" y1="364.39" x2="199" y2="372.39" style="stroke:#181818;stroke-width:1;"/><line x1="193" y1="364.39" x2="187" y2="372.39" style="stroke:#181818;stroke-width:1;"/><line x1="193" y1="364.39" x2="193" y2="372.39" style="stroke:#181818;stroke-width:1;"/><ellipse cx="193" cy="358.39" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="99.09" y="286.798" fill="#000" font-size="12" textLength="58.428">usuario_id</text><text x="69" y="306.598" fill="#000" font-size="12" textLength="118.609">ON DELETE CASCADE</text></g><!--link usuarios to ocorrencias--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="59" data-link-type="crowfoot"><path d="M324.5,274.43 C324.5,282.06 324.5,256.94 324.5,264.96" style="stroke:#181818;stroke-width:1;" fill="none" id="usuarios-ocorrencias" codeLine="59"/><line x1="324.5" y1="270.43" x2="324.5" y2="259.43" style="stroke:#181818;stroke-width:1;"/><ellipse cx="324.5" cy="270.43" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><line x1="320.5" y1="263.43" x2="328.5" y2="263.43" style="stroke:#181818;stroke-width:1;"/><line x1="324.5" y1="274.96" x2="330.5" y2="282.96" style="stroke:#181818;stroke-width:1;"/><line x1="324.5" y1="274.96" x2="318.5" y2="282.96" style="stroke:#181818;stroke-width:1;"/><line x1="324.5" y1="274.96" x2="324.5" y2="282.96" style="stroke:#181818;stroke-width:1;"/><ellipse cx="324.5" cy="268.96" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="364.484" y="242.088" fill="#000" font-size="12" textLength="46.5">autor_id</text><text x="330.5" y="261.888" fill="#000" font-size="12" textLength="114.469">legado admite NULL</text></g><!--link ocorrencias to anexos--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="60" data-link-type="crowfoot"><path d="M316.5,645.61 C316.5,653.47 316.5,635.26 316.5,642.92" style="stroke:#181818;stroke-width:1;" fill="none" id="ocorrencias-anexos" codeLine="60"/><line x1="312.5" y1="641.61" x2="320.5" y2="641.61" style="stroke:#181818;stroke-width:1;"/><line x1="312.5" y1="644.61" x2="320.5" y2="644.61" style="stroke:#181818;stroke-width:1;"/><line x1="316.5" y1="645.61" x2="316.5" y2="637.61" style="stroke:#181818;stroke-width:1;"/><line x1="316.5" y1="652.92" x2="322.5" y2="660.92" style="stroke:#181818;stroke-width:1;"/><line x1="316.5" y1="652.92" x2="310.5" y2="660.92" style="stroke:#181818;stroke-width:1;"/><line x1="316.5" y1="652.92" x2="316.5" y2="660.92" style="stroke:#181818;stroke-width:1;"/><ellipse cx="316.5" cy="646.92" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="213.92" y="620.158" fill="#000" font-size="12" textLength="75.769">ocorrencia_id</text><text x="192.5" y="639.958" fill="#000" font-size="12" textLength="118.609">ON DELETE CASCADE</text></g><g class="legend" data-source-line="80"><rect x="97.431" y="1040.4" width="506.887" height="204.799" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><ellipse cx="112.931" cy="1066" rx="2.5" ry="2.5" fill="#000"/><text x="119.431" y="1068.936" fill="#000" font-size="14" textLength="472.134">= NOT NULL, ou chave INTEGER PRIMARY KEY gerada automaticamente.</text><text x="107.431" y="1092.036" fill="#000" font-size="14" textLength="240.826">FK: sessoes.usuario_id → usuarios.id;</text><text x="107.431" y="1115.136" fill="#000" font-size="14" textLength="486.887">ocorrencias.autor_id → usuarios.id; anexos.ocorrencia_id → ocorrencias.id.</text><text x="107.431" y="1138.236" fill="#000" font-size="14" textLength="474.598">PKs INTEGER PRIMARY KEY; demais unicidades estão marcadas UNIQUE.</text><text x="107.431" y="1161.336" fill="#000" font-size="14" textLength="460.472">email usa COLLATE NOCASE. PRAGMA foreign_keys = ON por conexão.</text><text x="107.431" y="1184.436" fill="#000" font-size="14" textLength="477.72">Migração antiga adiciona autor e coordenadas nulos; não atribui autoria.</text><text x="107.431" y="1207.536" fill="#000" font-size="14" textLength="464.91">O CHECK de coordenadas em par não é acrescentado ao banco legado;</text><text x="107.431" y="1230.636" fill="#000" font-size="14" textLength="386.371">a API valida o par tanto no banco novo quanto no migrado.</text></g><g class="footer" data-source-line="2"><text x="211.605" y="1276.44" fill="#888" font-size="10" textLength="278.54">Esboço assistido por IA; revisar com o código antes de usar.</text></g><?plantuml-src dLRDRXit4BxhAGRfGNPWgueJrxQK65ZBArUmB2coN3I00ODQKXBXNL8ckOhTf41F1LgWbw9lq4FG0ZtrrglU94_I8RcIADkv-21Xb_FD3x_vE5p3JSgW7pVZ_lpNJgCLmM3-IwFJQaJm-QS_uBketJgE-j2BsrquwL_qkfVYEEx3QFwFvebqcFEtRMuOK0P3abmpGR_MoOHbfA9lqj98IiCKn7eevvya4AsvDfnAc4e5hQWEYisu9WeIcO64PFulvMF42SEq3PcZhL8oSWf6mb0QWp3A5KiCbw8quGX9k4fILjBNN4o98cXd8vAdfYc5wP2CmJaH-fmfFdeSSyv_OF1Y9p3g2Q7oFHTZ695KXw5JBfYvcpAGoanaO9WIIgt3Rh0c96MQJM4dZAs8k7QBhu959Wm